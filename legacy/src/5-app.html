(function(){

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));

const inr=n=>(n<0?'−':'')+'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
const inrC=n=>{const a=Math.abs(n),s=n<0?'−':'';if(a>=1e5)return s+'₹'+(a/1e5).toFixed(a%1e5<500?0:1).replace(/\.0$/,'')+'L';if(a>=1000)return s+'₹'+(a/1000).toFixed(a<1e4&&a%1000>=50?1:0).replace(/\.0$/,'')+'k';return s+'₹'+Math.round(a);};

function makeDemo(){
  const rnd=mulberry(20261005), pick=a=>a[Math.floor(rnd()*a.length)], amt=(lo,hi,m)=>Math.round((lo+rnd()*(hi-lo))*m/10)*10;
  const start=addMonth(CUR,-5);
  const settings={income:50000,goal:15000,budgets:defaultBudgets(),startMonth:start,recurring:[
    {id:'r1',n:'Ghar ka rent',a:12000,c:'rent',day:1},{id:'r2',n:'Gym membership',a:1000,c:'health',day:3},
    {id:'r3',n:'Jio Fiber + recharge',a:999,c:'bills',day:5},{id:'r4',n:'Bijli bill',a:1350,c:'bills',day:10},{id:'r5',n:'Netflix',a:199,c:'fun',day:12}]};
  const mult={'-5':0.93,'-4':1.0,'-3':0.86,'-2':1.2,'-1':1.07,'0':1.1};
  const N={food:['Swiggy','Zomato','Chai + samosa','Office lunch','Dinner bahar','Dominos','Momos','Coffee'],groc:['Blinkit','Zepto','DMart','Sabzi','Doodh + bread'],travel:['Uber','Rapido','Petrol','Metro card','Auto'],shop:['Amazon','Myntra','Flipkart','Naye shoes','Shirt'],fun:['Movie (PVR)','Bowling','Dosto ke saath party','BookMyShow'],health:['Medicine','Doctor visit'],other:['Gift','Haircut','Laundry']};
  const months={};

    const k=addMonth(CUR,off),m=mult[off],last=off===0?NOW.getDate():dim(k),items=[];

      if(rnd()<0.2)add(d,'groc',amt(400,1100,m));
      if(rnd()<0.075*m)add(d,'shop',amt(500,2600,m));
      if(rnd()<0.06*m)add(d,'fun',amt(300,1200,m));
      if(rnd()<0.03)add(d,'health',amt(200,900,1));

  settings.char=lsChar()||'gullu';
  const ago=n=>ymd(new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()-n)),ahead=n=>ymd(new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+n));

    {id:'L2',dir:'diya',who:'Priya',a:1200,d:ago(40),due:ago(3),n:'Concert ticket',paid:[{d:ago(10),a:500}]},
    {id:'L3',dir:'diya',who:'Aman',a:800,d:ago(60),due:ago(30),n:'Dinner split',paid:[{d:ago(28),a:800}],closed:true}];

}

let S=null, mode='demo', dbCol=null, firstSnap=true;
const view={month:CUR,tab:'entries',type:'e',cat:'food',catManual:false,filter:'all',wi:{},rec:{}};
const LS='paisaMahal.v1',LSC='paisaMahal.char';

function saveLsChar(c){try{localStorage.setItem(LSC,c)}catch(e){}}

/* ---- db sync ---- */
const dirty=new Set(),inflight=new Set();let flushT=0,flushing=false;
function markDirty(k){if(mode==='demo')return;dirty.add(k);lsSave();clearTimeout(flushT);flushT=setTimeout(flush,400);}
const monthKeyDoc=m=>'m_'+m;
const sent={};// k -> {rev,at}: our latest write, so a late/stale snapshot can't undo it
async function writeDoc(k){
  const ref=dbCol.doc(k),rev=uid();sent[k]={rev,at:Date.now()};
  if(k==='settings'){await ref.set(Object.assign({kind:'settings'},S.settings,{rev}));return;}
  if(k==='loans'){await ref.set({kind:'loans',items:S.loans||[],rev});return;}
  const m=k.slice(2),items=S.months[m];
  if(!items||!items.length)await ref.delete();else await ref.set({kind:'month',m,items,rev});
}
async function flush(){
  if(!dbCol){dirty.clear();return;}
  if(flushing){clearTimeout(flushT);flushT=setTimeout(flush,300);return;}
  flushing=true;
  try{
    while(dirty.size){
      const k=dirty.values().next().value;dirty.delete(k);inflight.add(k);
      try{await writeDoc(k);}catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*700));try{await writeDoc(k);}catch(e2){saveFail(e2);}}
        else saveFail(e);
      }
      inflight.delete(k);
    }
  }finally{flushing=false;}
}
function saveFail(e){
  const code=e&&e.code;
  if(code==='quota_exceeded')toast('Storage bhar gaya. Purane mahine ka backup lekar kuch entries hatao.');
  else if(code==='revoked'||code==='invalid_argument'||code==='not_granted'){dbCol=null;toast('Sync band ho gaya. Data is browser mein save ho raha hai.');}
  else toast('Save nahi ho paaya. Data is browser mein safe hai, thodi der mein phir try hoga.');
  setSync();
}
function cleanSettings(x){const s=Object.assign({},x);delete s.kind;delete s.rev;s.budgets=Object.assign(defaultBudgets(),s.budgets||{});s.recurring=Array.isArray(s.recurring)?s.recurring:[];s.started=true;if(!CHARS.some(c=>c.id===s.char))s.char=lsChar()||'gullu';return s;}
function applySnap(snap){
  let settings=null,loans=null;const months={};
  snap.docs.forEach(d=>{const x=d.data();if(!x)return;if(d.id==='loans'&&x.kind==='loans'){loans=Array.isArray(x.items)?x.items:[];return;}if(d.id==='settings')settings=x;else if(x.kind==='month'&&typeof x.m==='string')months[x.m]=Array.isArray(x.items)?x.items:[];});
  const revOf={};snap.docs.forEach(d=>{const x=d.data();if(x)revOf[d.id]=x.rev;});
  const stale=k=>{const w=sent[k];if(!w)return false;if(Date.now()-w.at>90000){delete sent[k];return false;}if(k.startsWith('m_')&&!S.months[k.slice(2)]&&!(k in revOf))return false;return revOf[k]!==w.rev;};
  const keep=k=>dirty.has(k)||inflight.has(k)||stale(k);
  if(!settings){
    if(firstSnap){
      firstSnap=false;
      if(mode==='local'){mode='db';markDirty('settings');Object.keys(S.months).forEach(m=>markDirty(monthKeyDoc(m)));if((S.loans||[]).length)markDirty('loans');}
    }else if(mode==='db'&&!keep('settings')){S=makeDemo();mode='demo';view.month=CUR;}
    setSync();renderAll();return;
  }
  if(firstSnap&&mode==='local'){
    // merge local-only entries into synced data once
    const local=S.months;Object.keys(local).forEach(m=>{const have=new Set((months[m]||[]).map(i=>i.id));const extra=local[m].filter(i=>!have.has(i.id));if(extra.length){months[m]=(months[m]||[]).concat(extra);dirty.add(monthKeyDoc(m));}});
    const haveL=new Set((loans||[]).map(l=>l.id)),extraL=(S.loans||[]).filter(l=>!haveL.has(l.id));if(extraL.length){loans=(loans||[]).concat(extraL);dirty.add('loans');}
    if(dirty.size){clearTimeout(flushT);flushT=setTimeout(flush,400);}
  }
  firstSnap=false;
  const next={settings:keep('settings')?S.settings:cleanSettings(settings),months:{},loans:keep('loans')&&S.loans?S.loans:(loans||[])};
  Object.keys(months).forEach(m=>next.months[m]=keep(monthKeyDoc(m))&&S.months[m]?S.months[m]:months[m]);
  if(S&&!S.demo)Object.keys(S.months).forEach(m=>{if(keep(monthKeyDoc(m)))next.months[m]=S.months[m];});
  S=next;mode='db';lsSave();setSync();renderAll(true);
}
async function connect(){
  if(!window.claude||typeof claude.use!=='function')return;
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbCol=db.collection('data/users/'+id);
    dbCol.onSnapshot(applySnap,()=>{dbCol=null;setSync();});
  }catch(e){dbCol=null;}
}

/* ================= calculations ================= */
function monthItems(k){
  const out=(S.months[k]||[]).slice();
  const st=S.settings;
  if(k>=st.startMonth&&k<=CUR){
    const D=dim(k),last=k===CUR?NOW.getDate():D;
    st.recurring.forEach(r=>{const d=Math.min(r.day,D);if(d<=last)out.push({id:'r_'+r.id,d:k+'-'+pad(d),a:r.a,c:r.c,n:r.n,t:'e',auto:true});});
  }
  return out;
}
function varSpentOf(k){return (S.months[k]||[]).reduce((s,i)=>s+(i.t==='e'?i.a:0),0);}
function stats(k,wi){
  const st=S.settings,items=monthItems(k),D=dim(k),isCur=k===CUR,dayNow=isCur?NOW.getDate():D;
  const byCat={},varByCat={},pendByCat={};CATS.forEach(c=>{byCat[c.id]=0;varByCat[c.id]=0;pendByCat[c.id]=0;});
  let spent=0,extraInc=0,auto=0;
  items.forEach(i=>{if(i.t==='i'){extraInc+=i.a;return;}const c=CAT[i.c]?i.c:'other';spent+=i.a;byCat[c]+=i.a;if(i.auto)auto+=i.a;else varByCat[c]+=i.a;});
  const income=st.income+extraInc,budget=Math.max(1,income-st.goal),varSpent=spent-auto;
  let pending=0,projVar=varSpent,pace=varSpent/Math.max(1,dayNow),big=0,prevDaily=null,prevSrc='';
  if(isCur&&k>=st.startMonth){
    st.recurring.forEach(r=>{if(Math.min(r.day,D)>dayNow){pending+=r.a;pendByCat[CAT[r.c]?r.c:'other']+=r.a;}});
    const pk=addMonth(k,-1);
    if(pk>=st.startMonth){const pv=varSpentOf(pk);if(pv>0){prevDaily=pv/dim(pk);prevSrc='prev';}}
    // one-off big purchases (over 15% of budget) count once, they don't set the daily pace
    const bigCut=budget*0.15;items.forEach(i=>{if(i.t==='e'&&!i.auto&&i.a>bigCut)big+=i.a;});
    if(prevDaily==null){const recTot=st.recurring.reduce((a,r)=>a+r.a,0);prevDaily=Math.max(0,budget-recTot)/D;prevSrc='budget';}
    const K=4;pace=(varSpent-big+prevDaily*K)/(dayNow+K);
    projVar=varSpent+pace*(D-dayNow);
  }
  const projByCat={},projVarByCat={};
  const scale=varSpent>0?projVar/varSpent:0;
  const varCats=CATS.filter(c=>c.id!=='rent'&&c.id!=='bills');
  const vb=varCats.reduce((s,c)=>s+(st.budgets[c.id]||0),0)||1;
  CATS.forEach(c=>{let v=varSpent>0?varByCat[c.id]*scale:(varCats.includes(c)?projVar*(st.budgets[c.id]||0)/vb:0);projVarByCat[c.id]=v;projByCat[c.id]=byCat[c.id]-varByCat[c.id]+v+pendByCat[c.id];});
  let projected=spent+pending+(projVar-varSpent);
  if(wi){let d=0;CATS.forEach(c=>{d+=projVarByCat[c.id]*(wi[c.id]||0)/100;});projected+=d;}
  const health=clamp((1.3-projected/budget)/0.6);
  return {k,items,spent,income,budget,projected,byCat,projByCat,projVarByCat,varByCat,health,dayNow,D,isCur,pending,pace,extraInc,auto,varSpent,big,prevDaily,prevSrc,saved:income-spent,projSaved:income-projected,hasData:k>=st.startMonth};
}
function spentUpTo(k,day){return monthItems(k).reduce((s,i)=>s+(i.t==='e'&&+i.d.slice(8)<=day?i.a:0),0);}
function tier(h){return h>0.8?{t:'Mazboot',c:'var(--good)'}:h>0.55?{t:'Theek hai',c:'var(--ok)'}:h>0.3?{t:'Daraarein aa rahi',c:'var(--warn)'}:{t:'Building gir rahi!',c:'var(--bad)'};}
function topOver(s){const b=S.settings.budgets;return CATS.map(c=>({c,r:s.projByCat[c.id]/Math.max(1,b[c.id]||0),v:s.projByCat[c.id]})).filter(x=>x.r>1.05&&x.v>300&&(b[x.c.id]||0)>0).sort((a,b)=>b.r-a.r)[0];}
function babuLine(s){
  const h=s.health,o=topOver(s);
  if(!s.isCur){
    if(s.saved>=S.settings.goal)return 'Is mahine '+inr(s.saved)+' bache. Goal poora, party toh banti hai!';
    if(s.saved>0)return 'Is mahine sirf '+inr(s.saved)+' bache. Goal '+inr(S.settings.goal)+' tha. Agla mahina better!';
    return 'Is mahine '+inr(-s.saved)+' zyada kharch ho gaya. Building ab tak hil rahi hai.';
  }
  if(h>0.8)return s.k.charCodeAt(6)%2?'Sab set hai! Aaj chai meri taraf se.':'Building mazboot, jeb bhari. Aise hi chalao!';
  if(h>0.55)return o?'Theek chal raha hai, bas '+o.c.n+' pe nazar rakhna.':'Theek chal raha hai. Thoda aur bachao toh suit wapas aa jaayega.';
  if(h>0.3)return o?o.c.n+' budget ka '+Math.round(o.r*100)+'% ho jaayega. Deewar mein daraar aa gayi!':'Bhai, thoda haath rok. Daraarein dikh rahi hain.';
  return o?'Jeb khaali! '+o.c.n+' ne building hila di. Ab ghar ka khaana.':'Jeb khaali, building tedhi. Ab sirf zaroori kharcha!';
}

const lastH={v:null};
function renderHero(){
  const s=stats(view.month),wiOn=view.tab==='whatif'&&Object.values(view.wi).some(v=>v),ws=wiOn?stats(view.month,view.wi):s;
  const h=ws.health,T=tier(h);
  if(window.PM3D){PM3D.setHealth(h);PM3D.setCharacter&&PM3D.setCharacter(S.settings.char||'gullu');PM3D.setFloors&&PM3D.setFloors(FLOORS.map(f=>({ratio:Math.max(...f.cats.map(c=>ws.projByCat[c]/Math.max(1,S.settings.budgets[c]||0))),color:CAT[f.cats[0]].c})));}
  $('bubbleName').textContent=charName(S.settings.char);

  $('bubbleTxt').textContent=Date.now()<tip.until?tip.text:babuLine(ws);

/* ---- chart helpers ---- */
function ticks(top){const m=top/Math.pow(10,Math.floor(Math.log10(top)));return Math.abs(m-2)<1e-9?4:5;}
function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;}
function boxW(el){return Math.max(260,Math.floor((el.clientWidth||520)-20));}
function attachTip(box,svg,getTip){
  const tip=box.querySelector('.tip');
  const move=ev=>{const r=svg.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;const res=getTip(x,y);if(!res){tip.hidden=true;return;}tip.hidden=false;tip.innerHTML=res.html;const br=box.getBoundingClientRect();let lx=r.left-br.left+res.x;lx=Math.max(70,Math.min(br.width-70,lx));tip.style.left=lx+'px';tip.style.top=(r.top-br.top+res.y)+'px';};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('pointerleave',()=>tip.hidden=true);
}

function rCompare(){

  if(!prevOk){h+='<div class="note">Pichle mahine ka data nahi hai. Agle mahine se comparison yahan dikhega.</div>';}
  else{
    const ps=stats(pk);
    if(s.isCur){
      const day=s.dayNow,a=spentUpTo(k,day),b=spentUpTo(pk,Math.min(day,dim(pk)));
      h+='<div class="kpis">'+kpi('1–'+day+' '+mShort(k)+' tak',a,b,'vs 1–'+Math.min(day,dim(pk))+' '+mShort(pk)+': '+inr(b))+kpi('Month-end anumaan',s.projected,ps.spent,'vs '+mShort(pk)+' total: '+inr(ps.spent))+'</div>';
      thisCat=c=>monthItems(k).reduce((x,i)=>x+(i.t==='e'&&i.c===c?i.a:0),0);
      prevCat=c=>monthItems(pk).reduce((x,i)=>x+(i.t==='e'&&i.c===c&&+i.d.slice(8)<=day?i.a:0),0);
      thisLbl=mShort(k)+' (ab tak)';prevLbl=mShort(pk)+' (same date tak)';
    }else{
      h+='<div class="kpis">'+kpi(mShort(k)+' ka kharcha',s.spent,ps.spent,'vs '+mShort(pk)+': '+inr(ps.spent))+kpi(mShort(k)+' ki bachat',s.saved,ps.saved,'vs '+mShort(pk)+': '+inr(ps.saved),true)+'</div>';
      thisCat=c=>s.byCat[c];prevCat=c=>ps.byCat[c];thisLbl=mShort(k);prevLbl=mShort(pk);
    }
    const rows=CATS.map(c=>({c,a:thisCat(c.id),b:prevCat(c.id)})).filter(r=>r.a||r.b).sort((x,y)=>Math.max(y.a,y.b)-Math.max(x.a,x.b));
    const mx=Math.max(1,...rows.map(r=>Math.max(r.a,r.b)));
    h+='<div class="legend"><span><i style="background:var(--ink2)"></i>'+thisLbl+' (category ka rang)</span><span><i style="background:#C9CFC8"></i>'+prevLbl+'</span></div><div class="cmp">';
    rows.forEach(r=>{const d=r.a-r.b,pc=r.b?Math.round(d/r.b*100):null;
      const cls=Math.abs(d)<50?'flat':d>0?'up':'down',txt=Math.abs(d)<50?'Same':(d>0?'↑ ':'↓ ')+inr(Math.abs(d))+(pc!==null&&Math.abs(pc)<1000?' ('+Math.abs(pc)+'%)':'');
      h+='<div class="cmp-row" style="--cc:'+r.c.c+'"><div class="nm"><i></i>'+r.c.n+'</div><div class="vals num"><b>'+inr(r.a)+'</b> · '+inr(r.b)+' <span class="delta '+cls+'">'+txt+'</span></div><div class="bars"><div style="width:'+(r.a/mx*100)+'%;background:'+r.c.c+'"></div><div style="width:'+(r.b/mx*100)+'%;background:#C9CFC8"></div></div></div>';});
    h+='</div>';
  }
  h+='<div class="chartbox" id="cb6"><div class="ttl"><span>Pichle 6 mahine</span><span class="legend"><span><i style="background:var(--s1)"></i>Kharcha</span><span><i style="background:#A9C8F0"></i>Anumaan</span><span><i class="dash"></i>Budget</span></span></div><div class="tip" hidden></div><svg id="sv6"></svg></div><p class="sub">Kisi bhi mahine ke bar pe tap karo, building us mahine ki dikhegi.</p>';
  p.innerHTML=h;
  draw6();
}
function kpi(label,a,b,sub,higherGood){
  const d=a-b,pc=b?Math.round(d/Math.abs(b)*100):0,good=higherGood?d>=0:d<=0;

}
function draw6(){

  ss.forEach((s,i)=>{

    const yb=y(s.budget);g+='<line x1="'+(cx-band*0.42)+'" x2="'+(cx+band*0.42)+'" y1="'+yb+'" y2="'+yb+'" stroke="#78827B" stroke-width="1.5" stroke-dasharray="4 3"/>';
    const T=tier(s.health);
    g+='<text class="axis" x="'+cx+'" y="'+(H-P.b+15)+'" text-anchor="middle" style="font-weight:'+(sel?800:500)+';fill:'+(sel?'var(--ink)':'var(--muted)')+'">'+mShort(s.k)+'</text>';
    g+='<circle cx="'+(cx-11)+'" cy="'+(H-P.b+29)+'" r="4" fill="'+T.c+'"/><text class="axis" x="'+(cx-4)+'" y="'+(H-P.b+32.5)+'" style="fill:var(--ink2)">'+Math.round(s.health*100)+'</text>';
  });
  g+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#C9CFC8"/>';
  g+='<rect x="'+P.l+'" y="0" width="'+iw+'" height="'+H+'" fill="transparent" style="cursor:pointer"/>';
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('width',W);svg.setAttribute('height',H);svg.innerHTML=g;

  attachTip(box,svg,(x)=>{const i=idx(x);if(i<0)return null;const s=ss[i];return {x:P.l+band*i+band/2,y:y(Math.max(s.isCur?s.projected:s.spent,s.budget))-6,html:'<b>'+mName(s.k)+'</b><br>Kharcha '+inr(s.spent)+(s.isCur?'<br>Anumaan '+inr(s.projected):'')+'<br>Budget '+inr(s.budget)+'<br>Bachat '+inr(s.isCur?s.projSaved:s.saved)+' · Health '+Math.round(s.health*100)};});
  svg.onclick=ev=>{const r=svg.getBoundingClientRect(),i=idx(ev.clientX-r.left);if(i>=0&&ss[i].k!==view.month){view.month=ss[i].k;renderAll();}};

const rect=(x,y,w,h,f,op)=>h<=0?'':'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'" opacity="'+op+'"/>';
function roundTop(x,y,w,h,f,op){if(h<=0)return '';const r=Math.min(4,h,w/2);return '<path d="M'+x+' '+(y+h)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+w-r)+'Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+'V'+(y+h)+'Z" fill="'+f+'" opacity="'+op+'"/>';}

function rProj(){

  let h='<div class="panel-head"><h3>Projection</h3><p class="sub">'+(s.isCur?'Is pace pe aage kya hoga':mName(view.month)+' ka record')+'</p></div>';
  if(s.isCur){

    h+='<div class="kpis"><div class="st">'+ib('proj','Month-end anumaan')+'<span>Month-end anumaan</span><b class="num">'+inr(s.projected)+'</b><small class="num"><span class="delta '+(d>0?'up':'down')+'">'+(d>0?inr(d)+' zyada':inr(-d)+' kam')+'</span> budget '+inrC(s.budget)+' se</small></div><div class="st">'+ib('daily','Roz ka safe limit')+'<span>Roz ka safe limit</span><b class="num">'+(daily>0?inr(daily):'₹0')+'</b><small>'+(daily>0?'baaki '+daysLeft+' din, bills ke baad':'budget khatam, sirf zaroori kharcha')+'</small></div></div>';
  }

  const series=[];let cum=0;for(let i=0;i<12;i++){cum+=i===0?cs.projSaved:avg;series.push(cum);}
  const goal12=st.goal*12,diff=series[11]-goal12;

  h+='<div class="chartbox" id="cbS"><div class="ttl"><span>Agle 12 mahine: total bachat</span><span class="legend"><span><i style="background:var(--s3)"></i>Is pace pe</span><span><i class="dash"></i>Goal ('+inrC(st.goal)+'/mahina)</span></span></div><div class="tip" hidden></div><svg id="svS"></svg></div>';
  const lp=loanSum();if(lp.recv>0)h+='<div class="note">Iske upar <b class="num">'+inr(lp.recv)+'</b> udhaar wapas aana hai'+(lp.nextMonth>0?', jisme se <b class="num">'+inr(lp.nextMonth)+'</b> agle mahine tak':'')+'. Yeh bachat mein nahi joda gaya, Udhaar tab mein dekho.</div>';
  const extra=2000;h+='<div class="note">Har mahine sirf <b>'+inr(extra)+'</b> aur bachao toh saal mein <b>'+inr(extra*12)+'</b> extra. What-if tab mein dekho kahan se kat sakta hai.</div>';
  p.innerHTML=h;
  drawDaily(s);drawSave(series,st.goal);
}
function drawDaily(s){
  const box=$('cbD'),svg=$('svD'),W=boxW(box),H=200,P={l:42,r:12,t:14,b:24};
  const items=monthItems(s.k).filter(i=>i.t==='e'),perDay=new Array(s.D+1).fill(0);items.forEach(i=>perDay[+i.d.slice(8)]+=i.a);
  const act=[0];for(let d=1;d<=s.dayNow;d++)act[d]=act[d-1]+perDay[d];
  const proj=[];if(s.isCur){proj[s.dayNow]=act[s.dayNow];const rec={};S.settings.recurring.forEach(r=>{const d=Math.min(r.day,s.D);if(d>s.dayNow)rec[d]=(rec[d]||0)+r.a;});for(let d=s.dayNow+1;d<=s.D;d++)proj[d]=proj[d-1]+s.pace+(rec[d]||0);}
  const top=Math.max(s.budget,act[s.dayNow],proj[s.D]||0);const ymax=niceMax(top*1.06);
  const iw=W-P.l-P.r,ih=H-P.t-P.b,x=d=>P.l+(d-1)/(s.D-1)*iw,y=v=>P.t+ih-v/ymax*ih;
  let g='';const TN=ticks(ymax);for(let i=0;i<=TN;i++){const v=ymax*i/TN,yy=y(v);g+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+yy+'" y2="'+yy+'" stroke="#E3E7E0"/><text class="axis" x="'+(P.l-6)+'" y="'+(yy+3.5)+'" text-anchor="end">'+inrC(v)+'</text>';}
  [1,8,15,22,s.D].forEach(d=>g+='<text class="axis" x="'+x(d)+'" y="'+(H-6)+'" text-anchor="middle">'+d+'</text>');
  const yb=y(s.budget);g+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+yb+'" y2="'+yb+'" stroke="#78827B" stroke-width="1.5" stroke-dasharray="5 4"/><text class="axis" x="'+(P.l+4)+'" y="'+(yb-5)+'" style="fill:var(--ink2);font-weight:700">Budget '+inrC(s.budget)+'</text>';
  let pa='M'+x(1)+' '+y(act[1]);for(let d=2;d<=s.dayNow;d++)pa+='L'+x(d)+' '+y(act[d]);
  g+='<path d="'+pa+'L'+x(s.dayNow)+' '+y(0)+'L'+x(1)+' '+y(0)+'Z" fill="var(--s1)" opacity=".1"/><path d="'+pa+'" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linejoin="round"/>';
  if(s.isCur&&s.D>s.dayNow){let pp='M'+x(s.dayNow)+' '+y(proj[s.dayNow]);for(let d=s.dayNow+1;d<=s.D;d++)pp+='L'+x(d)+' '+y(proj[d]);g+='<path d="'+pp+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-dasharray="5 4" opacity=".75"/><circle cx="'+x(s.D)+'" cy="'+y(proj[s.D])+'" r="4" fill="#fff" stroke="var(--s1)" stroke-width="2"/>';}
  g+='<circle cx="'+x(s.dayNow)+'" cy="'+y(act[s.dayNow])+'" r="4.5" fill="var(--s1)" stroke="#fff" stroke-width="2"/>';
  g+='<line id="xh" x1="0" x2="0" y1="'+P.t+'" y2="'+(H-P.b)+'" stroke="#78827B" stroke-width="1" opacity="0"/>';
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('width',W);svg.setAttribute('height',H);svg.innerHTML=g;
  const xh=svg.querySelector('#xh');
  attachTip(box,svg,(px)=>{const d=Math.round((px-P.l)/iw*(s.D-1))+1;if(d<1||d>s.D){xh.setAttribute('opacity',0);return null;}const isA=d<=s.dayNow,v=isA?act[d]:proj[d];if(v==null){xh.setAttribute('opacity',0);return null;}xh.setAttribute('x1',x(d));xh.setAttribute('x2',x(d));xh.setAttribute('opacity',.5);return {x:x(d),y:y(v)-8,html:'<b>'+d+' '+mShort(s.k)+'</b><br>'+(isA?'Ab tak ':'Anumaan ')+inr(v)};});
  svg.addEventListener('pointerleave',()=>xh.setAttribute('opacity',0));
}
function drawSave(series,goal){
  const box=$('cbS'),svg=$('svS'),W=boxW(box),H=190,P={l:46,r:14,t:14,b:24};
  const goals=series.map((_,i)=>goal*(i+1));
  const lo=Math.min(0,...series),hi=niceMax(Math.max(...series,...goals)*1.05);
  const iw=W-P.l-P.r,ih=H-P.t-P.b,x=i=>P.l+i/11*iw,y=v=>P.t+ih-(v-lo)/(hi-lo)*ih;
  let g='';const TN=ticks(hi);for(let i=0;i<=TN;i++){const v=lo+(hi-lo)*i/TN,yy=y(v);g+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+yy+'" y2="'+yy+'" stroke="#E3E7E0"/><text class="axis" x="'+(P.l-6)+'" y="'+(yy+3.5)+'" text-anchor="end">'+inrC(v)+'</text>';}
  [0,3,6,9,11].forEach(i=>g+='<text class="axis" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+mShort(addMonth(CUR,i))+'</text>');
  let pg='';goals.forEach((v,i)=>pg+=(i?'L':'M')+x(i)+' '+y(v));g+='<path d="'+pg+'" fill="none" stroke="#78827B" stroke-width="1.6" stroke-dasharray="5 4"/>';
  let ps='';series.forEach((v,i)=>ps+=(i?'L':'M')+x(i)+' '+y(v));
  g+='<path d="'+ps+'L'+x(11)+' '+y(Math.max(lo,0))+'L'+x(0)+' '+y(Math.max(lo,0))+'Z" fill="var(--s3)" opacity=".12"/><path d="'+ps+'" fill="none" stroke="var(--s3)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="'+x(11)+'" cy="'+y(series[11])+'" r="4.5" fill="var(--s3)" stroke="#fff" stroke-width="2"/>';
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('width',W);svg.setAttribute('height',H);svg.innerHTML=g;
  attachTip(box,svg,(px)=>{const i=Math.round((px-P.l)/iw*11);if(i<0||i>11)return null;return {x:x(i),y:Math.min(y(series[i]),y(goals[i]))-8,html:'<b>'+mName(addMonth(CUR,i))+' tak</b><br>Bachat ~'+inr(series[i])+'<br>Goal '+inr(goals[i])};});
}

/* ---- udhaar (money lent / borrowed) — kept apart from kharcha, so health and budgets stay untouched ---- */
function cleanLoan(l){return {id:String(l.id||uid()),dir:l.dir==='liya'?'liya':'diya',who:String(l.who).slice(0,40),a:Math.round(l.a),d:/^\d{4}-\d{2}-\d{2}$/.test(l.d)?l.d:TODAY,due:/^\d{4}-\d{2}-\d{2}$/.test(l.due)?l.due:'',n:String(l.n||'').slice(0,60),paid:Array.isArray(l.paid)?l.paid.filter(p=>p&&typeof p.a==='number').map(p=>({d:p.d||TODAY,a:Math.round(p.a)})):[],closed:!!l.closed};}
const paidOf=l=>(l.paid||[]).reduce((s,p)=>s+p.a,0);
const leftOf=l=>Math.max(0,l.a-paidOf(l));
function dayDiff(a,b){const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5);}
function loanSum(){
  const L=(S.loans||[]).filter(l=>!l.closed);const nm=addMonth(CUR,1)+'-31';
  const recvL=L.filter(l=>l.dir==='diya'),giveL=L.filter(l=>l.dir==='liya');
  return {recv:recvL.reduce((s,l)=>s+leftOf(l),0),give:giveL.reduce((s,l)=>s+leftOf(l),0),recvN:recvL.length,
    nextMonth:recvL.filter(l=>l.due&&l.due<=nm).reduce((s,l)=>s+leftOf(l),0),
    late:recvL.filter(l=>l.due&&l.due<TODAY).length,lateGive:giveL.filter(l=>l.due&&l.due<TODAY).length};
}
function dueChip(l){
  if(l.closed)return '<span class="delta down">Hisaab barabar</span>';
  if(!l.due)return '<span class="delta flat">Date tay nahi</span>';
  const n=dayDiff(TODAY,l.due);const [y,m,d]=l.due.split('-').map(Number);const dt=new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  if(n<0)return '<span class="delta up">'+(-n)+' din late</span>';
  if(n===0)return '<span class="delta flat" style="background:var(--warn-soft);color:#7A4E00">Aaj '+(l.dir==='diya'?'aana':'dena')+' hai</span>';
  return '<span class="delta flat">'+(n<=30?n+' din mein':dt+' tak')+'</span>';
}
const nextMonthDate=()=>{const d=new Date(NOW.getFullYear(),NOW.getMonth()+1,NOW.getDate());if(d.getDate()!==NOW.getDate())d.setDate(0);return ymd(d);};

    {const room=s.budget-s.spent-s.pending;return {t:'Roz ka limit',f:'(Budget − Kharcha − Aane wale bills) ÷ Baaki din',rows:[R('','Budget',inr(s.budget)),R('−','Ab tak ka kharcha',inr(s.spent)),R('−','Aane wale fixed bills',inr(s.pending)),R('=','Kharch karne ko bacha',inr(room)),R('÷','Baaki din (aaj samet)',daysLeft+' din'),R('=','Roz ka limit',room>0?inr(room/daysLeft):'₹0','tot')],n:'Aane wale bills woh "har mahine wale kharche" hain jinki date abhi aani hai. Unka paisa pehle hi alag rakha gaya hai.'};}

  }

/* ================= toast ================= */
let toastT=0,undoFn=null;
function toast(msg,undo,ms){const el=$('toast');$('toastTxt').textContent=msg;undoFn=undo||null;$('toastBtn').hidden=!undo;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),ms||(undo?5500:3200));}
$('toastBtn').onclick=()=>{if(undoFn){const f=undoFn;undoFn=null;f();}$('toast').classList.remove('show');};

/* ================= render ================= */
function renderAll(fromSync){
  if(!fromSync&&window.__closeInfo)__closeInfo();
  if(view.month>CUR)view.month=CUR;
  if(view.month<S.settings.startMonth&&view.month<CUR)view.month=S.settings.startMonth;
  setSync();renderMonthNav();renderHero();
  const ae=document.activeElement,pn=$('p-'+view.tab);
  if(fromSync&&pn&&ae&&pn.contains(ae)&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName))return;
  renderPanel();
}
let rsT=0;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(view.tab==='compare'||view.tab==='proj')renderPanel();},200);});

/* ================= full-screen layout ================= */
const phone=()=>matchMedia('(max-width:760px)').matches;
function layout(){
  if(!window.PM3D||!PM3D.setLayout)return;
  const focus=document.body.classList.contains('focus');
  if(phone())PM3D.setLayout({panelW:0,sheetH:focus?0:$('dock').getBoundingClientRect().height,topH:60});
  else PM3D.setLayout({panelW:focus?0:$('dock').getBoundingClientRect().width+32,sheetH:0,topH:0});
}
function sheet(f){$('dock').classList.toggle('full',f);document.body.classList.toggle('sheet-full',f);$('handle').setAttribute('aria-expanded',f);setTimeout(layout,380);}
$('handle').onclick=()=>sheet(!$('dock').classList.contains('full'));
$('focusBtn').onclick=()=>{const on=document.body.classList.toggle('focus');$('focusBtn').setAttribute('aria-pressed',on);$('focusBtn').innerHTML=on?'☰ <span>Panel wapas lao</span>':'◎ <span>Sirf duniya dekho</span>';$('focusBtn').setAttribute('aria-label',on?'Panel wapas lao':'Sirf duniya dekho');setTimeout(layout,on?0:380);};
window.addEventListener('resize',()=>setTimeout(layout,50));
// phone: tapping into the form or tabs opens the sheet fully
['amt','note'].forEach(id=>$(id).addEventListener('focus',()=>{if(phone()&&!$('dock').classList.contains('full'))sheet(true);}));
$('addForm').addEventListener('submit',()=>{if(phone())setTimeout(()=>sheet(false),60);});
// bubble follows the character
(function(){const b=$('bubble');if(!window.PM3D)return;let lastT=0;
  PM3D.onFrame=a=>{
    const r=b.getBoundingClientRect(),W=innerWidth,Hh=innerHeight,focus=document.body.classList.contains('focus'),dr=focus?null:$('dock').getBoundingClientRect();
    const right=dr&&!phone()?dr.left-12:W-12,bottom=dr&&phone()?dr.top-12:Hh-12;
    let x=a.x-r.width/2,y=a.y-r.height;
    x=Math.max(12,Math.min(right-r.width,x));y=Math.max(70,Math.min(bottom-r.height,y));
    b.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
    const tail=Math.max(18,Math.min(r.width-18,a.x-x));if(Math.abs(tail-lastT)>0.5){b.style.setProperty('--tail',tail+'px');lastT=tail;}
    b.style.opacity=a.ok&&a.y<bottom+20?1:0;
  };})();


/* ================= 3D world interactions: floors, chhat, sikke, character ================= */
const FLOORS=[{cats:['rent']},{cats:['bills']},{cats:['groc']},{cats:['food']},{cats:['travel']},{cats:['shop']},{cats:['fun','health','other']}];
const FLOOR_NAMES=['Ground floor','1st floor','2nd floor','3rd floor','4th floor','5th floor','6th floor'];
const floorOf=c=>{const i=FLOORS.findIndex(f=>f.cats.includes(c));return i<0?6:i;};
const tip={until:0,text:'',i:0};
function timeMode(){try{return localStorage.getItem('paisaMahal.time')||'auto'}catch(_){return 'auto'}}
function charTips(){
  const s=stats(CUR),st=S.settings,out=[],o=topOver(s),daysLeft=s.D-s.dayNow+1;
  if(o){const extra=s.projByCat[o.c.id]-(st.budgets[o.c.id]||0);out.push(o.c.n+' is pace pe budget ka '+Math.round(o.r*100)+'% jaayega. Roz '+inr(Math.ceil(extra/daysLeft))+' kam karo toh bach jaayega.');}
  const daily=(s.budget-s.spent-s.pending)/daysLeft;
  out.push(daily>0?'Aaj '+inr(daily)+' tak kharch karo, mahina safe rahega.':'Budget khatam! Ab sirf zaroori kharcha, warna building aur hilegi.');
  const late=(S.loans||[]).filter(l=>!l.closed&&l.dir==='diya'&&l.due&&l.due<TODAY).sort((a,b)=>a.due.localeCompare(b.due))[0];
  if(late)out.push(late.who+' ka '+inr(leftOf(late))+' '+dayDiff(late.due,TODAY)+' din se late hai. Udhaar tab se yaad dila do.');
  const up=st.recurring.filter(r=>r.day>s.dayNow&&r.day-s.dayNow<=5).sort((a,b)=>a.day-b.day)[0];
  if(up)out.push(up.n+' ka '+inr(up.a)+' '+up.day+' tareekh ko katega. Paise ready rakhna.');
  out.push('Is pace pe mahine ke end mein '+inr(s.projSaved)+' bachega'+(s.projSaved>=st.goal?', goal poora!':', goal se '+inr(st.goal-s.projSaved)+' kam.'));
  out.push('Mujhe tap karte raho, par kharcha mat karte raho!');
  return out;
}
(function(){
  if(!window.PM3D||!PM3D.react)return;
  const tag=document.createElement('div');tag.className='hovertag';tag.hidden=true;document.body.appendChild(tag);
  const card=document.createElement('div');card.className='info glass pick';card.id='pickPop';card.setAttribute('role','dialog');card.hidden=true;document.body.appendChild(card);
  const bar=(r)=>'<div class="pbar"><div style="width:'+Math.min(100,r*100)+'%;background:'+(r>1?'var(--bad)':r>0.85?'var(--warn)':'var(--good)')+'"></div>'+(r>1?'<i style="left:'+Math.min(100,100/r)+'%"></i>':'')+'</div>';
  function floorHtml(i){
    const s=stats(view.month),st=S.settings,f=FLOORS[i];
    let h='<div class="info-h"><b>'+FLOOR_NAMES[i]+' · '+f.cats.map(c=>CAT[c].n).join(', ')+'</b><button class="info-x" aria-label="Band karo">×</button></div>';
    f.cats.forEach(c=>{const b=st.budgets[c]||0,sp=s.byCat[c],pj=s.projByCat[c],r=pj/Math.max(1,b);
      h+='<div class="pcat"><div class="pcat-h"><span><i style="background:'+CAT[c].c+'"></i>'+CAT[c].n+'</span><b class="num">'+inr(sp)+' <small>/ '+inr(b)+'</small></b></div>'+bar(r)
        +'<small class="pnote">'+(s.isCur?'Month-end anumaan '+inr(pj)+' · ':'')+(b<=0?'Budget set nahi':r>1?'<b style="color:var(--bad)">'+inr(pj-b)+' zyada</b>, isliye is floor pe daraar':r>0.85?'Budget ke kareeb':'Budget ke andar, floor mazboot')+'</small></div>';});
    h+='<div class="btnrow"><button class="btn sm" data-go="entries" data-cat="'+f.cats[0]+'">Entries dekho</button><button class="btn sm ghost" data-go="whatif">What-if mein ghatao</button></div>';
    return h;
  }
  function roofHtml(){const s=stats(view.month),st=S.settings,v=s.isCur?s.projSaved:s.saved,r=v/Math.max(1,st.goal);
    return '<div class="info-h"><b>Chhat · Bachat</b><button class="info-x" aria-label="Band karo">×</button></div><p class="info-f">Chhat tumhari bachat hai. Goal poora toh chhat pe jhanda lehrata hai.</p><div class="info-rows"><div class="ir"><span class="op"></span><span class="l">Bachat goal</span><span class="v num">'+inr(st.goal)+'</span></div><div class="ir tot"><span class="op"></span><span class="l">'+(s.isCur?'Mahine ke end tak anumaan':'Asli bachat')+'</span><span class="v num">'+inr(v)+'</span></div></div>'+bar(Math.max(0,r)>1?1:Math.max(0,r))+'<p class="info-n">'+(v>=st.goal?'Goal poora ho raha hai!':'Goal se '+inr(st.goal-v)+' peeche.')+'</p><div class="btnrow"><button class="btn sm" data-go="proj">Projection dekho</button></div>';}
  function coinsHtml(){const s=stats(view.month),n=Math.round(s.health*21);
    return '<div class="info-h"><b>Bachat ke sikke</b><button class="info-x" aria-label="Band karo">×</button></div><p class="info-f">Jitni health, utne sikke. Abhi '+n+' / 21 sikke dikh rahe hain (health '+Math.round(s.health*100)+').</p><p class="info-n">Income add karoge toh aasmaan se sikke barsenge. Kharcha add karoge toh ek sikka udke us category ke floor mein jaayega.</p>';}
  function place(x,y){card.hidden=false;const r=card.getBoundingClientRect(),W=innerWidth,Hh=innerHeight,dock=document.body.classList.contains('focus')?null:$('dock').getBoundingClientRect();
    const right=dock&&!phone()?dock.left-12:W-12,bottom=dock&&phone()?dock.top-12:Hh-12;
    let px=x+18,py=y-r.height/2;if(px+r.width>right)px=x-18-r.width;px=Math.max(12,Math.min(right-r.width,px));py=Math.max(70,Math.min(bottom-r.height,py));
    card.style.left=px+'px';card.style.top=py+'px';}
  let openPick=null;
  function close(){if(!openPick)return;openPick=null;card.hidden=true;PM3D.select(null);}
  window.__closePick=close;
  PM3D.onPick=(p,x,y)=>{
    tag.hidden=true;
    if(!p){close();return;}
    if(p.type==='char'){close();const tips=charTips();tip.text=tips[tip.i%tips.length];tip.i++;tip.until=Date.now()+7000;PM3D.focusChar(6000);renderHero();setTimeout(()=>{if(Date.now()>=tip.until)renderHero();},7100);return;}
    openPick=p;PM3D.select(p);
    card.innerHTML=p.type==='floor'?floorHtml(p.i):p.type==='roof'?roofHtml():coinsHtml();
    place(x,y);
  };
  PM3D.onHover=(p,x,y,same)=>{
    if(!p||phone()){tag.hidden=true;return;}
    if(!same){const s=stats(view.month);
      tag.textContent=p.type==='floor'?FLOORS[p.i].cats.map(c=>CAT[c].n).join(', ')+' · '+Math.round(Math.max(...FLOORS[p.i].cats.map(c=>s.projByCat[c]/Math.max(1,S.settings.budgets[c]||0)))*100)+'% budget':p.type==='roof'?'Chhat · Bachat':p.type==='coins'?'Bachat ke sikke':charName(S.settings.char)+': tap karo, tip milegi';}
    tag.hidden=false;tag.style.transform='translate('+(x+14)+'px,'+(y+16)+'px)';
  };
  card.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('info-x')){close();return;}
    const go=b.dataset.go;if(!go)return;
    if(go==='entries'){view.filter=b.dataset.cat||'all';}
    close();if(document.body.classList.contains('focus'))$('focusBtn').click();
    setTab(go);if(phone())sheet(true);
    const pn=$('p-'+go);if(pn&&pn.scrollIntoView)pn.scrollIntoView({block:'start',behavior:'smooth'});
  });
  document.addEventListener('click',e=>{if(!openPick)return;if(card.contains(e.target)||e.target===$('cv'))return;close();},true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
  // camera buttons
  $('camIn').onclick=()=>PM3D.zoomBy(0.82);$('camOut').onclick=()=>PM3D.zoomBy(1.22);$('camReset').onclick=()=>{close();PM3D.resetView();};
  PM3D.setTimeMode(timeMode());
  try{if(!localStorage.getItem('paisaMahal.hint3d')){setTimeout(()=>toast('Tip: building ke kisi floor pe tap karo, us category ka hisaab dikhega. Character ko tap karo, tip dega. Scroll se zoom, double-tap se reset.',null,9000),2500);localStorage.setItem('paisaMahal.hint3d','1');}}catch(_){}
})();
/* ================= boot ================= */
const local=lsLoad();
if(local){S={settings:cleanSettings(local.settings),months:local.months||{},loans:Array.isArray(local.loans)?local.loans:[]};mode='local';}else{S=makeDemo();mode='demo';}
renderCatPick();setType('e');setTab('entries');renderAll();layout();
connect();
(async()=>{try{if(window.claude&&claude.use){dlApi=await claude.use('downloads');if(dlApi&&view.tab==='setup')rSetup();}}catch(_){dlApi=null;}})();
})();
</script>
